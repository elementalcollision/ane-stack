name: hw-skip-discipline

# TEST-2: a test that needs hardware but runs without it must report SKIPPED —
# never silently PASSED. This workflow simulates "no hardware" by shadowing
# `xcrun` so `coremlc_path()` returns None, then asserts the SKIP channel fires
# and that MIL_REQUIRE_HW=1 turns the skip into a hard failure.
#
# Runs on macOS, not Linux: mil_infer is the macOS/ANE crate and does not
# compile on Linux, so the no-hardware case can only be exercised on macOS
# with the toolchain lookup shadowed.
on:
  push:
  pull_request:

jobs:
  skip-honesty:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: simulate no-hardware (shadow xcrun so coremlc is "absent")
        run: |
          mkdir -p "$RUNNER_TEMP/noxcrun"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/noxcrun/xcrun"
          chmod +x "$RUNNER_TEMP/noxcrun/xcrun"
          echo "NOXCRUN_DIR=$RUNNER_TEMP/noxcrun" >> "$GITHUB_ENV"

      - name: default mode reports skips loudly (not silent passes)
        run: |
          set -o pipefail
          out="$(env PATH="$NOXCRUN_DIR:$PATH" cargo test --manifest-path vendor/mil_spec/Cargo.toml -p mil_infer --test ops_e2e -- --nocapture 2>&1)"
          echo "$out" | tail -6
          skips="$(echo "$out" | grep -c 'SKIP: hardware unavailable')"
          echo "SKIP lines emitted: $skips"
          # Every coremlc-gated test must emit a loud SKIP line, none may fail.
          if [ "$skips" -lt 1 ]; then
            echo "::error::no SKIP lines — gates are silent (the lie TEST-2 fixes)"
            exit 1
          fi
          if echo "$out" | grep -q "test result: FAILED"; then
            echo "::error::a test FAILED on a no-hardware runner"
            exit 1
          fi
          echo "OK: $skips loud skips, 0 failures"

      - name: MIL_REQUIRE_HW=1 turns a skip into a failure
        run: |
          set -o pipefail
          if env PATH="$NOXCRUN_DIR:$PATH" MIL_REQUIRE_HW=1 cargo test --manifest-path vendor/mil_spec/Cargo.toml -p mil_infer --test ops_e2e 2>&1 | grep -q "SKIP: hardware required"; then
            echo "OK: MIL_REQUIRE_HW=1 fails loudly on missing hardware"
          else
            echo "::error::MIL_REQUIRE_HW=1 did not produce a hard failure"
            exit 1
          fi
